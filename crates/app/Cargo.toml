[package]
name = "database-manager"
version.workspace = true
edition.workspace = true

[dependencies]
dbm-core.workspace = true
dbm-driver-sqlite.workspace = true
dbm-driver-postgres.workspace = true
dbm-driver-oracle.workspace = true
dbm-ssh.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["svg"] }
egui-phosphor = "0.14"
rfd = "0.17"
keyring = "4"
toml = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Embeds the app icon and name in the Windows executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
